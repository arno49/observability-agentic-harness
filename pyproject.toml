[project]
name = "oah"
version = "0.0.2"
description = "Observability Agentic Harness — LLM/GenAI observability instrumentation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "jsonschema>=4.20",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

# litellm is optional: only S1 disambiguation and S4 design (design/event-schema/
# dtos/readiness) need it, and its transitive dependency tree (openai, boto3,
# tiktoken, huggingface-hub, aiohttp, pydantic, ...) is large enough that forcing
# it on every install -- including the fully-deterministic doctor/estimate/map
# --no-disambiguate/inventory/gaps/interview path -- wasn't worth it. See
# oah/llm_client.py's get_completion_fn().
#
# claude-agent-sdk is a separate, Anthropic-pinned axis (architecture.md: S10/S11
# require the Agent SDK's file-mutation/agent tooling specifically, refused for
# any other provider rather than degraded) -- its own extra, not folded into
# `llm`, since nothing LiteLLM-based needs it and vice versa.
[project.optional-dependencies]
llm = [
    "litellm>=1.50",
]
agent = [
    "claude-agent-sdk>=0.2",
]
dev = [
    "pytest>=8.0",
    "oah[llm]",
    "oah[agent]",
]

[project.scripts]
oah = "oah.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oah*"]

# estimate_constants.json ships as-is; _bundled/ is scripts/sync_package_data.py's
# build-time snapshot of the repo-root schemas/ + skills/ directories (see
# oah/_resources.py) -- absent in a dev checkout, present in a built wheel/sdist.
[tool.setuptools.package-data]
oah = ["estimate_constants.json", "_bundled/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
