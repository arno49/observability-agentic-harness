name: Publish to PyPI

# Publishes the `oah` package to PyPI using Trusted Publishing (OIDC) --
# no long-lived API token stored as a secret. This requires a one-time
# setup on pypi.org before the first run (see the note below); until
# that's done, the `pypi-publish` step fails with an authentication error,
# not a token typo.
#
# One-time setup (do this once, as the PyPI project owner):
#   1. On PyPI, go to https://pypi.org/manage/account/publishing/
#      ("Add a new pending publisher" if the `oah` project doesn't exist
#      on PyPI yet, or Project -> Settings -> Publishing once it does).
#   2. PyPI project name: oah
#      Owner: arno49   Repository name: observability-agentic-harness
#      Workflow name: publish-pypi.yml   Environment name: pypi
#   3. Repo Settings -> Environments -> create an environment named `pypi`
#      (matches step 2). Optionally add required reviewers there for an
#      extra manual gate before every publish.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# The tag's version (after stripping the leading "v") must match
# pyproject.toml's [project].version exactly -- a mismatch fails the
# workflow before anything is built or uploaded, so a forgotten version
# bump can't silently publish the wrong build.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Install oah with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Bundle schemas/ + skills/ into oah/_bundled/ for the wheel
        run: python scripts/sync_package_data.py

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: write    # required to create the GitHub release below
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
