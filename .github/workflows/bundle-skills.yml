name: Bundle skills

# Debug/tooling side-product: packages skills/*/SKILL.md (plus their
# references/, examples/, io/ subfolders, and an injected scripts/validate.py)
# into downloadable, run-scoped artifacts on every push that touches
# skills/**, so a skill drafted in this repo can be tried in a live Claude
# session without manual copy-paste. Artifacts here expire after 30 days —
# for a durable, versioned download see release-skills.yml instead. See
# docs/skills-bundle.md. Not part of the OAH pipeline itself.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".github/workflows/bundle-skills.yml"
      - ".github/workflows/_skills-build.yml"
  workflow_dispatch: {}

jobs:
  bundle:
    uses: ./.github/workflows/_skills-build.yml
